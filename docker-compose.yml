services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ai_search
      SEED_SAMPLE_DATA: "true"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
